name: Build React portfolio and publish to gp-portfolio

on:
  push:
    branches: [gp-portfolio-build]
  pull_request:
    branches: [gp-portfolio-build]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release with the validated output'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gp-portfolio-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'gp-portfolio-build' || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        working-directory: portfolio
        run: npm ci --no-audit --no-fund

      - name: Build static site
        working-directory: portfolio
        run: npm run build

      - name: Check output
        run: |
          test -s portfolio/dist/index.html
          test -d portfolio/dist/assets

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Preserve validated output
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-${{ steps.source.outputs.sha }}
          path: portfolio/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish static assets to gp-portfolio
        if: github.event_name != 'pull_request'
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "::error::Configure PAGES_DEPLOY_TOKEN (fine-grained PAT with Contents: Read and write) in repository Actions secrets. A GITHUB_TOKEN push does not trigger branch-based GitHub Pages builds."
            exit 1
          fi
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_TERMINAL_PROMPT=0
          # Validate the PAT before attempting Git operations.
          if ! GH_TOKEN="$PAGES_DEPLOY_TOKEN" gh api "repos/$GITHUB_REPOSITORY" --silent >/dev/null; then
            echo "::error::PAGES_DEPLOY_TOKEN cannot access this repository. Verify expiration, selected repository, and Contents: Read and write permissions."
            exit 1
          fi
          # Git's credential helper supplies the token without embedding it in the remote URL.
          git config --global credential.helper '!f() { if [ "$1" = get ]; then printf "username=x-access-token\\npassword=%s\\n" "$PAGES_DEPLOY_TOKEN"; fi; }; f'
          git config --global credential.https://github.com.useHttpPath true
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          cp -a portfolio/dist "${RUNNER_TEMP}/site"
          touch "${RUNNER_TEMP}/site/.nojekyll"
          for attempt in 1 2 3; do
            git fetch origin gp-portfolio
            if [ -d "${RUNNER_TEMP}/gp-portfolio-worktree" ]; then
              git worktree remove --force "${RUNNER_TEMP}/gp-portfolio-worktree"
            fi
            git worktree add --detach "${RUNNER_TEMP}/gp-portfolio-worktree" FETCH_HEAD
            cd "${RUNNER_TEMP}/gp-portfolio-worktree"
            git rm -rq --ignore-unmatch .
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "${RUNNER_TEMP}/site/." .
            git add -A
            if git diff --cached --quiet; then
              echo "No portfolio changes to publish."
              exit 0
            fi
            git commit -m 'deploy: update React portfolio'
            if git push origin HEAD:gp-portfolio; then
              echo "Published to gp-portfolio."
              exit 0
            fi
            cd "$GITHUB_WORKSPACE"
            echo "Push rejected; retrying against latest branch ($attempt/3)"
          done
          echo "::error::Could not publish after three attempts"
          exit 1

      - name: Create release from validated output
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_TAG: portfolio-${{ github.run_id }}.${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/portfolio.tar.gz" -C portfolio/dist .
          sha256sum "$RUNNER_TEMP/portfolio.tar.gz" | sed "s|$RUNNER_TEMP/||" > "$RUNNER_TEMP/SHA256SUMS"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/portfolio.tar.gz" "$RUNNER_TEMP/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "portfolio $RELEASE_TAG" --latest=false \
            --notes "Validated portfolio output from commit $SOURCE_SHA. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
