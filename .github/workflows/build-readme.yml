name: Build and publish profile README v2

on:
  push:
    branches: [build-readme]
  pull_request:
    branches: [build-readme]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release with the validated output'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-profile-readme-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'build-readme' || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            .readme/requirements.txt
            .readme/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r .readme/requirements-dev.txt

      - name: Validate profile data
        run: python .readme/build_readme.py --check

      - name: Run automated tests
        run: python -m pytest -q .readme/tests

      - name: Generate README
        run: python .readme/build_readme.py

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Preserve validated output
        uses: actions/upload-artifact@v4
        with:
          name: readme-${{ steps.source.outputs.sha }}
          path: README.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish README to main safely
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cp README.md "${RUNNER_TEMP}/generated-README.md"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # Rebase the single-file update on the latest main, never force push.
          for attempt in 1 2 3; do
            git -c http.extraheader="$AUTH_HEADER" fetch origin main
            if [ -d "${RUNNER_TEMP}/publish-main" ]; then
              git worktree remove --force "${RUNNER_TEMP}/publish-main"
            fi
            git worktree add --detach "${RUNNER_TEMP}/publish-main" FETCH_HEAD
            cd "${RUNNER_TEMP}/publish-main"
            cp "${RUNNER_TEMP}/generated-README.md" README.md
            git add -- README.md
            if git diff --cached --quiet; then
              echo "README unchanged; no publication necessary."
              exit 0
            fi
            git commit -m 'docs: regenerate profile README [skip ci]'
            if git -c http.extraheader="$AUTH_HEADER" push origin HEAD:main; then
              echo "README published to main."
              exit 0
            fi
            cd "$GITHUB_WORKSPACE"
            echo "Push rejected (attempt $attempt); retrying against latest main..."
          done
          echo "::error::Unable to publish README after three non-force attempts."
          exit 1

      - name: Create release from validated output
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_TAG: readme-${{ github.run_id }}.${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          cp README.md "$RUNNER_TEMP/README.md"
          (cd "$RUNNER_TEMP" && sha256sum README.md > SHA256SUMS)
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/README.md" "$RUNNER_TEMP/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "readme $RELEASE_TAG" --latest=false \
            --notes "Validated readme output from commit $SOURCE_SHA. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
