name: Build README

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: build-readme
  cancel-in-progress: false

jobs:
  build-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install README build dependencies
        run: python3 -m pip install -r .readme/requirements.txt

      - name: Build README
        run: python3 .readme/build_readme.py

      - name: Commit generated README to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. Save the generated README.md to a temporary location
          cp README.md /tmp/README.md

          # 2. Switch to main branch and ensure it is up to date
          git checkout main
          git pull origin main --rebase

          # 3. Restore the generated README.md
          cp /tmp/README.md README.md

          # 4. Check if README.md has any changes to be committed
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date on main."
            exit 0
          fi

          # 5. Commit and push to main branch
          git add README.md
          git commit -m "build: update generated readme [skip ci]"
          git push origin main
