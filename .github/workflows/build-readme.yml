name: Build and publish profile README

on:
  push:
    branches: [build-readme]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-profile-readme
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: build-readme
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .readme/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r .readme/requirements.txt

      - name: Generate README
        run: python .readme/build_readme.py

      - name: Publish generated README to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cp README.md "${RUNNER_TEMP}/generated-README.md"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch origin main
          git checkout -B main FETCH_HEAD
          cp "${RUNNER_TEMP}/generated-README.md" README.md
          git add README.md
          if git diff --cached --quiet; then
            echo 'README unchanged; nothing to publish.'
            exit 0
          fi
          git commit -m 'docs: regenerate profile README [skip ci]'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main
